<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FDF8EE" />
      <stop offset="55%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#D9B872" />
    </radialGradient>
    <radialGradient id="bowlGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9A5B25" />
      <stop offset="65%" stop-color="#5C3211" />
      <stop offset="100%" stop-color="#2E1605" />
    </radialGradient>
    <radialGradient id="makhanaPuff" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FAF3E3" />
      <stop offset="85%" stop-color="#E8D8B9" />
      <stop offset="100%" stop-color="#C8B18A" />
    </radialGradient>
    <radialGradient id="makhanaWarm" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F7ECDA" />
      <stop offset="85%" stop-color="#DFC9A3" />
      <stop offset="100%" stop-color="#B89B6E" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2E1605" flood-opacity="0.32" />
    </filter>
    <filter id="puffShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#4A2C11" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Warm studio backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Subtle traditional brass ring accent -->
  <ellipse cx="400" cy="465" rx="285" ry="62" fill="#2E1605" opacity="0.16" />
  <ellipse cx="400" cy="450" rx="260" ry="52" fill="#B8860B" opacity="0.22" />

  <!-- Handcrafted wooden & brass bowl base -->
  <g filter="url(#softShadow)">
    <path d="M 155 320 C 165 470, 275 515, 400 515 C 525 515, 635 470, 645 320 Z" fill="url(#bowlGrad)" />
    <ellipse cx="400" cy="320" rx="245" ry="58" fill="#47240A" stroke="#D4AF37" stroke-width="4" />
    <ellipse cx="400" cy="320" rx="232" ry="48" fill="#2A1405" />
  </g>

  <!-- Back layer of Phool Makhana (Fox Nuts) -->
  <g filter="url(#puffShadow)">
    <g transform="translate(245, 255) rotate(-15)">
      <ellipse cx="0" cy="0" rx="46" ry="39" fill="url(#makhanaWarm)" />
      <path d="M -18 -8 Q 0 -18 18 -6" stroke="#8C5828" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.65" />
      <circle cx="-6" cy="10" r="4" fill="#6E4219" opacity="0.55" />
    </g>
    <g transform="translate(325, 228) rotate(12)">
      <ellipse cx="0" cy="0" rx="50" ry="42" fill="url(#makhanaPuff)" />
      <path d="M -16 -10 Q 2 -20 20 -8" stroke="#7A491E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
    </g>
    <g transform="translate(415, 220) rotate(-8)">
      <ellipse cx="0" cy="0" rx="52" ry="44" fill="url(#makhanaPuff)" />
      <circle cx="8" cy="-8" r="5.5" fill="#5C3211" opacity="0.65" />
      <path d="M -20 6 Q -4 16 14 8" stroke="#8C5828" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5" />
    </g>
    <g transform="translate(502, 236) rotate(22)">
      <ellipse cx="0" cy="0" rx="48" ry="40" fill="url(#makhanaWarm)" />
      <path d="M -14 -6 Q 0 -16 16 -4" stroke="#7A491E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
    </g>
    <g transform="translate(565, 268) rotate(-18)">
      <ellipse cx="0" cy="0" rx="45" ry="38" fill="url(#makhanaPuff)" />
      <circle cx="-8" cy="-4" r="4.5" fill="#6E4219" opacity="0.6" />
    </g>

    <!-- Middle layer of Large Handpicked Phool Makhana -->
    <g transform="translate(205, 298) rotate(8)">
      <ellipse cx="0" cy="0" rx="48" ry="40" fill="url(#makhanaPuff)" />
      <circle cx="6" cy="-5" r="5" fill="#5C3211" opacity="0.7" />
      <path d="M -18 4 Q 0 14 18 4" stroke="#9C6B3B" stroke-width="2.5" fill="none" opacity="0.55" />
    </g>
    <g transform="translate(285, 282) rotate(-20)">
      <ellipse cx="0" cy="0" rx="54" ry="45" fill="url(#makhanaPuff)" />
      <path d="M -22 -4 Q -2 -18 20 -4" stroke="#6E4219" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.65" />
      <circle cx="4" cy="10" r="4" fill="#5C3211" opacity="0.5" />
    </g>
    <g transform="translate(375, 268) rotate(5)">
      <ellipse cx="0" cy="0" rx="58" ry="48" fill="url(#makhanaPuff)" />
      <circle cx="-8" cy="-6" r="6" fill="#4A2508" opacity="0.72" />
      <path d="M -22 8 Q 2 20 24 6" stroke="#8C5828" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55" />
    </g>
    <g transform="translate(468, 275) rotate(-14)">
      <ellipse cx="0" cy="0" rx="55" ry="46" fill="url(#makhanaWarm)" />
      <path d="M -18 -8 Q 4 -20 22 -6" stroke="#6E4219" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.65" />
      <circle cx="10" cy="8" r="4.5" fill="#5C3211" opacity="0.6" />
    </g>
    <g transform="translate(548, 302) rotate(16)">
      <ellipse cx="0" cy="0" rx="50" ry="42" fill="url(#makhanaPuff)" />
      <circle cx="-5" cy="-6" r="5" fill="#5C3211" opacity="0.65" />
      <path d="M -16 8 Q 0 16 18 6" stroke="#8C5828" stroke-width="2.5" fill="none" opacity="0.5" />
    </g>
    <g transform="translate(605, 308) rotate(-10)">
      <ellipse cx="0" cy="0" rx="42" ry="35" fill="url(#makhanaWarm)" />
      <path d="M -12 -4 Q 0 -14 14 -4" stroke="#6E4219" stroke-width="3" fill="none" opacity="0.6" />
    </g>

    <!-- Foreground Crown Layer of Extra-Bold Jumbo Makhana -->
    <g transform="translate(242, 334) rotate(-8)">
      <ellipse cx="0" cy="0" rx="52" ry="43" fill="url(#makhanaWarm)" />
      <path d="M -18 -6 Q 0 -18 20 -5" stroke="#6E4219" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.68" />
    </g>
    <g transform="translate(332, 326) rotate(14)">
      <ellipse cx="0" cy="0" rx="58" ry="48" fill="url(#makhanaPuff)" />
      <circle cx="6" cy="-6" r="6" fill="#4A2508" opacity="0.75" />
      <path d="M -24 6 Q 0 18 22 4" stroke="#8C5828" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55" />
    </g>
    <g transform="translate(428, 328) rotate(-10)">
      <ellipse cx="0" cy="0" rx="60" ry="49" fill="url(#makhanaPuff)" />
      <path d="M -22 -8 Q 0 -22 24 -6" stroke="#5C3211" stroke-width="3.8" fill="none" stroke-linecap="round" opacity="0.72" />
      <circle cx="-4" cy="10" r="5" fill="#6E4219" opacity="0.58" />
    </g>
    <g transform="translate(520, 334) rotate(9)">
      <ellipse cx="0" cy="0" rx="52" ry="43" fill="url(#makhanaWarm)" />
      <circle cx="-6" cy="-4" r="5.5" fill="#4A2508" opacity="0.7" />
      <path d="M -18 8 Q 2 18 20 6" stroke="#8C5828" stroke-width="2.8" fill="none" opacity="0.55" />
    </g>

    <!-- Scattered Jumbo Makhana Pearls in front of the bowl -->
    <g transform="translate(210, 488) rotate(-18)">
      <ellipse cx="0" cy="0" rx="42" ry="35" fill="url(#makhanaPuff)" />
      <circle cx="5" cy="-4" r="4.5" fill="#5C3211" opacity="0.7" />
    </g>
    <g transform="translate(285, 515) rotate(12)">
      <ellipse cx="0" cy="0" rx="45" ry="37" fill="url(#makhanaWarm)" />
      <path d="M -15 -5 Q 0 -15 16 -4" stroke="#6E4219" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65" />
    </g>
    <g transform="translate(535, 508) rotate(-14)">
      <ellipse cx="0" cy="0" rx="44" ry="36" fill="url(#makhanaPuff)" />
      <circle cx="-6" cy="-4" r="5" fill="#4A2508" opacity="0.72" />
    </g>
  </g>
</svg>
